name: Release

# Baut die EXE und veröffentlicht sie als GitHub-Release, sobald sich die Version
# in src/main/resources/app.properties ändert (oder manuell über "Run workflow").
on:
  push:
    branches: [main]
    paths: ['src/main/resources/app.properties']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Version lesen
        id: v
        run: |
          echo "version=$(grep '^version=' src/main/resources/app.properties | cut -d= -f2 | tr -d '\r')" >> "$GITHUB_OUTPUT"
          echo "build=$(grep '^build=' src/main/resources/app.properties | cut -d= -f2 | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - name: Bauen
        run: mvn -B -q -DskipTests clean package
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" target/JellyfinPC.exe --target "$GITHUB_SHA" \
            --title "JellyfinPC ${{ steps.v.outputs.version }}" --notes "Automatischer Build ${{ steps.v.outputs.build }}."
      - name: version.json aktualisieren
        run: |
          MD5=$(md5sum target/JellyfinPC.exe | cut -d' ' -f1)
          python3 - "$MD5" "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.build }}" <<'PY'
          import json, sys
          md5, ver, build = sys.argv[1:4]
          d = json.load(open('version.json'))
          w = d['windows']
          w.update(build=int(build), version=ver, md5=md5,
                   url=f"https://github.com/Chronixx4/JellyfinPC/releases/download/v{ver}/JellyfinPC.exe")
          json.dump(d, open('version.json', 'w'), indent=2, ensure_ascii=False)
          PY
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add version.json
          git diff --cached --quiet || { git commit -m "version.json: ${{ steps.v.outputs.version }} [skip ci]"; git push; }
